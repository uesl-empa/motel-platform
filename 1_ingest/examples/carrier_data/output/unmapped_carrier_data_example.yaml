- carrier_name: Grid Electricity
  carrier:
    carrier_description: Grid-level electricity, levels 4-7 (1-36 kV)
    carrier_type: electricity
    carrier_category: other
  data_category: emission_intensity
  scope:
    geographic_scope: GEO_CH
    geographic_scope_description: Switzerland
    temporal_scope: TIME_2030
    temporal_scope_description: Series anchored on the 2030 projection year
    system_boundary: Cradle-to-gate life cycle
    system_boundary_description: Life-cycle greenhouse gas emissions from fuel extraction to delivery at the grid connection point. Excludes end-use conversion losses.
    scenario: Illustrative baseline
    scope_notes: All scope values in this example are placeholders.
  sources:
    - source_name: MotelCarrierDataExample
      source_description: Synthetic placeholder source used only to demonstrate the carrier data staging format.
