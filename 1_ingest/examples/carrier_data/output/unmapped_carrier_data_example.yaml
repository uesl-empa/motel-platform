      confidence_level: low
      assessment_method: estimated
      reference_year: 2026
      linked_attribute:
        - Carrier Emission Intensity
      source_notes: Not a real publication. Do not cite.
  # time_index is a scalar, so a trajectory is one attribute entry per period.
  attributes:
