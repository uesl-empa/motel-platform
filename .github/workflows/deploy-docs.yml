name: Deploy Docs

on:
  push:
    branches: [main]
    paths:
      - docs/**
      - motel-db/**
      - tools/build_release.py
      - 3_ontology_mapping/**
      - .github/workflows/deploy-docs.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build the public release of motel-db
        # Withholds every value whose sources do not permit redistribution, and
        # fails if any such value is still in the release.
        run: |
          python -m pip install pyyaml
          python tools/build_release.py --out dist/motel-db

      - name: Build the data explorer's data from the public release
        run: python docs/build_data.py --db dist/motel-db

      - name: Build the ontology TTL from the public release
        # Published at data/cls_atr_motel.ttl for motel-webapp and other
        # consumers, instead of committing a TTL built from the full database.
        run: python 3_ontology_mapping/scripts/gen_ttl.py --db dist/motel-db --out docs/data/cls_atr_motel.ttl

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static docs
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
