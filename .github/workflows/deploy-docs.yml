name: Deploy Docs

on:
  push:
    branches: [main]
    paths:
      - docs/**
      - motel-db/**
      - tools/build_release.py
      - 3_ontology_mapping/**
      - .github/workflows/deploy-docs.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check that motel-db is a release
        # Refuses to publish if any value is not backed exclusively by
        # permitted sources.
        run: |
          python -m pip install pyyaml
          python tools/build_release.py --check motel-db

      - name: Build the data explorer's data
        run: python docs/build_data.py --db motel-db

      - name: Build the ontology TTL from the release
        # Published at data/cls_atr_motel.ttl for motel-webapp and other
        # consumers, instead of committing a TTL.
        run: python 3_ontology_mapping/scripts/gen_ttl.py --db motel-db --out docs/data/cls_atr_motel.ttl

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static docs
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
