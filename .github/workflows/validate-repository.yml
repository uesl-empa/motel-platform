name: Validate Repository

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install validation dependencies
        run: python -m pip install pyyaml

      - name: Check that no restricted source material is committed
        # Raw source workbooks and saved notebook outputs carry source values
        # that may not be republished; they belong in the private motel-data
        # repository.
        run: |
          python - <<'PY'
          import json
          import subprocess
          import sys

          tracked = subprocess.run(["git", "ls-files"], capture_output=True, text=True,
                                   check=True).stdout.splitlines()
          problems = [f"{path}: spreadsheet" for path in tracked
                      if path.lower().endswith((".xlsx", ".xls", ".xlsm"))]
          for path in tracked:
              if path.endswith(".ipynb"):
                  with open(path, encoding="utf-8") as handle:
                      cells = json.load(handle)["cells"]
                  if any(cell.get("outputs") for cell in cells):
                      problems.append(f"{path}: saved outputs (clear them before committing)")
          for problem in problems:
              print(problem)
          sys.exit(1 if problems else 0)
          PY

      - name: Check Python syntax
        run: python -m compileall 1_ingest 2_harmonise 3_ontology_mapping 4_data_explore tools

      - name: Validate staging records against the unmapped schemas
        run: |
          python tools/validate_unmapped.py             motel-db/unmapped_entity             motel-db/unmapped_carrier_data             1_ingest/examples

      - name: Smoke-test Step 2 harmonisation without an LLM
        # Harmonises any pending staging records into this throwaway checkout
        # and fails if a created linked entity has a broken reference.
        run: python 2_harmonise/harmonise.py motel-db/unmapped_entity --no-llm --no-backup

      - name: Build the public release of motel-db
        # Fails if a value whose sources do not permit redistribution is still
        # in the release, or if motel-db gained a file the filter does not know.
        run: python tools/build_release.py --out dist/motel-db

      - name: Validate the released staging records
        run: |
          python tools/validate_unmapped.py \
            dist/motel-db/unmapped_entity \
            dist/motel-db/unmapped_carrier_data

      - name: Build the data explorer's data from the public release
        run: python docs/build_data.py --db dist/motel-db

      - name: Validate YAML and CSV files
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path

          import yaml

          roots = [Path("schema"), Path("schema_human"), Path("motel-db")]

          for root in roots:
              for path in root.rglob("*.yaml"):
                  with path.open(encoding="utf-8") as handle:
                      yaml.safe_load(handle)

              for path in root.rglob("*.csv"):
                  with path.open(encoding="utf-8-sig", newline="") as handle:
                      reader = csv.reader(handle)
                      next(reader, None)
                      for _ in reader:
                          pass

          print("YAML and CSV files are readable.")
          PY
