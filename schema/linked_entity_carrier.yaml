$schema: "http://json-schema.org/draft-07/schema#"
title: LinkedEntityCarrier
type: object
description: Validated carrier-bound record linking strict foreign keys to controlled vocabularies, used for modelling data that belongs to an energy carrier rather than to a technology, such as energy prices and emission intensities.
required:
  - linked_carrier_data_id
  - carrier_id
  - sources
properties:
  linked_carrier_data_id:
    type: string
    description: Primary database key uniquely identifying this carrier data record (e.g., LCD_00001).
  version:
    type: object
    description: Maintains formal audit trail history and deployment lifecycles for tracked parameters.
    required:
      - version_number
    properties:
      version_number:
        type: string
        description: Semantic version tracking text for schema iteration indexing (e.g., 2.1.0).
      date_created:
        type: string
        format: date
        description: ISO 8601 creation calendar timestamp (YYYY-MM-DD).
      date_modified:
        type: string
        format: date
        description: ISO 8601 calendar timestamp tracking the most recent attribute update or review patch (YYYY-MM-DD).
  carrier_id:
    type: string
    foreign_key: carrier.carrier_id
    description: Relational link tying these data values to a validated commodity vector in the carrier controlled vocabulary.
  data_category:
    type: string
    enum: [price, emission_intensity, availability, resource_potential, demand, other]
    description: Coarse grouping classifying what this record states about the carrier, used for filtering and for wiring the record into a model.
  sources:
    type: array
    description: Array of validated literature sources providing data for this record, mapping specific attributes to their exact origins.
    items:
      type: object
      required:
        - source_id
        - linked_attributes
      properties:
        source_id:
          type: string
          foreign_key: source.source_id
          description: Relational link tying these values back to an explicitly validated and structured literature profile node.
        linked_attributes:
          type: array
          description: Array of attribute ID tokens explicitly extracted from this specific reference source document.
          items:
            type: string
            foreign_key: attribute.attribute_id
            description: Validated token matching a master attribute registration node.
  assumptions:
    type: array
    description: Array of shared global assumption profile blocks, mapping specific attributes to their underlying system or methodology rules.
    items:
      type: object
      required:
        - assumption_id
        - linked_attributes
      properties:
        assumption_id:
          type: string
          description: Relational link referencing a shared global assumption profile block (e.g., ASSUMP_TAXES_EXCLUDED).
        linked_attributes:
          type: array
          description: Array of attribute ID tokens whose calculations or boundaries are governed by this specific assumption.
          items:
            type: string
            foreign_key: attribute.attribute_id
            description: Validated token matching a master attribute registration node.
  scope:
    type: object
    description: Structured boundaries restricting model solver access based on spatial, temporal, volume, and accounting rules.
    properties:
      geographic_scope:
        type: string
        foreign_key: geographic_scope.geographic_scope
        description: Foreign key reference anchoring the value to a controlled geographic territory or market zone token.
      temporal_scope:
        type: string
        foreign_key: temporal_scope.temporal_scope
        description: Foreign key reference anchoring the validity to a specific target model timeframe index node.
      capacity_scope:
        type: string
        foreign_key: capacity_scope.capacity_scope
        description: Foreign key reference linking validity to a controlled consumption band, contract size, or volume tier.
      system_boundary:
        type: string
        foreign_key: system_boundary.system_boundary
        description: Foreign key reference specifying the accounting boundary, such as the life-cycle stage covered by an emission factor or the cost components included in a price.
      scenario:
        type: string
        description: The modelled narrative, price track, or sensitivity path this record belongs to.
  values:
    type: array
    description: Normalised parameter arrays binding attributes to precise mathematical numbers and explicit engineering error bounds.
    items:
      type: object
      properties:
        attribute_id:
          type: string
          foreign_key: attribute.attribute_id
          description: Foreign key reference targeting a metric variable within the attribute controlled vocabulary.
        attribute_name:
          type: string
          description: Canonical attribute name carried alongside the ID so the record stays readable without a vocabulary join.
        value:
          type: [number, string, boolean, array, object]
          description: The computational data payload matching the data schema constraints of the assigned attribute.
        time_index:
          type: string
          description: Chronological anchor string for this value, e.g. a single year. For a series across multiple periods, use one attribute entry per period rather than combining years here.
        value_format:
          type: string
          description: Strict variable typing rules or code compilation path rules used to format downstream array parsers.
        value_type:
          type: string
          enum: [numeric, text, boolean, array, timeseries, distribution]
          description: System logic classification determining how downstream solvers treat the parameter matrix entry.
        unit:
          type: string
          description: System-wide normalised execution unit string strictly synced with core attribute standard definitions.
        uncertainty:
          type: object
          description: Fleshed-out relational boundaries mapping exact low/high limits for stochastic or deterministic sensitivity runs.
          properties:
            uncertainty_type:
              type: string
              enum: [range, standard_deviation, confidence_interval, variance]
              description: Mathematical formatting context governing how upper, lower, and standard error variables are processed.
            upper_value:
              type: number
              description: The absolute maximum upper bounding value observed under testing thresholds.
            lower_value:
              type: number
              description: The absolute minimum lower bounding value observed under testing thresholds.
            other_value:
              type: string
              description: Alternative notation values or alphanumeric statistical metadata payloads (e.g., confidence step percentages).
            uncertainty_assumption:
              type: string
              description: Relational notation tracking the statistical distribution profiles applied during solver execution.
        note:
          type: string
          description: User-facing comment string highlighting internal computational idiosyncrasies.
  date_created:
    type: string
    format: date
    description: ISO 8601 date on which the harmonisation pipeline created this record (YYYY-MM-DD).
