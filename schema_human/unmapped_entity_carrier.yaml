UnmappedEntityCarrier: # Staging schema for raw, unstructured carrier-level modelling data such as energy prices, emission intensities, and availability, captured before normalisation.
    schema_version: "[String] Version of the MOTEL schema release this record was authored against (e.g. 0.3.0). Lets an ingesting repository pin a contract and lets validation report a mismatch instead of failing obscurely."
    carrier_name: "[Required; String] The literal unparsed name or label of the energy carrier or commodity as specified in the raw source material."
    carrier: # [Dictionary] Contains raw descriptive properties detailing the physical and market context of the unmapped carrier.
        carrier_description: "[String] Free-text description of the carrier, including purity, phase, voltage level, or infrastructure context as stated in the source."
        carrier_type: "[String] The raw classification of the commodity archetype as given by the source. Suggested: ['fuel', 'electricity', 'heat', 'other']"
        carrier_category: "[String] Environmental lifecycle grouping for the commodity as given by the source. Suggested: ['renewable', 'non-renewable', 'synthetic', 'other']"
        carrier_notes: "[String] Free-text carrier context, including reference states, heating-value conventions, grid level, or other source-specific notes."
    data_category: "[String] Coarse grouping of what this record describes about the carrier, used for filtering and for downstream model wiring. Suggested: ['price', 'emission_intensity', 'availability', 'resource_potential', 'demand', 'other']"
    scope: # [Dictionary] Defines the specific contextual boundaries where the unmapped raw data point remains operationally valid.
        geographic_scope: "[String] Literal raw geographic scope value from the source, such as a region code, market zone, or country label."
        geographic_scope_description: "[String] Human-readable explanation of the geographic scope value, including its semantic meaning, classification context, or market-zone reading."
        temporal_scope: "[String] Literal raw year, period, or time-horizon value from the source."
        temporal_scope_description: "[String] Human-readable explanation of the temporal scope value when extra context is needed."
        capacity_scope: "[String] Literal raw capacity, size-threshold, consumption band, or volume tier the value applies to, such as a minimum installation size or a household consumption band for a tariff."
        capacity_scope_description: "[String] Human-readable explanation of the capacity, consumption band, or volume tier value when extra context is needed."
        system_boundary: "[String] Literal raw system- or accounting-boundary label from the source, such as the equipment included in a cost figure, the life-cycle stage covered by an emission factor, or the cost components included in a price."
        system_boundary_description: "[String] Human-readable explanation of the boundary value, including inclusion rules and exclusions, for example plant ready to operate versus complete installation, combustion only versus cradle-to-gate, or taxes and levies included versus excluded."
        scenario: "[String] The specific modelled narrative, price track, or sensitivity path from the source."
        scope_notes: "[String] Free-text metadata or provenance notes for scope fields, such as source column details or parsing caveats."
    sources: # [List of Dictionaries] Only source_name is required; all other fields preserve optional provenance before source harmonisation.
        source_name: "[Required; String] Concise source label or citation key. Prefer a short, human-readable name rather than a full title."
        source_description: "[String] Longer citation string, full title, or document reference as found in the raw material."
        link: "[String] URL, DOI, or other resolvable locator as recorded in the raw material."
        source_type: "[String] Free-text medium classification, such as report, dataset, article, standard, website, or expert input."
        access_date: "[String] Date when an online source was accessed or checked, preferably ISO 8601 when available."
        confidence_level: "[String] Optional source-quality or trust rating carried from the source register when available."
        reference_year: "[Integer/String] Optional publication or release year for the source material, ideally as a four-digit year."
        assessment_method: "[String] Short note on how the source was assessed or how values were derived."
        source_locator: "[String] Page numbers, table references, section names, sheet names, or other location hints showing where the evidence can be found within the source."
        linked_attribute: "[List of Strings] Free-text list of attribute names this source supports; no foreign key enforcement at this stage."
        source_licence: "[String] Licence or terms of use of the source material, exactly as the publisher states it (e.g. CC BY 4.0, OGL, "all rights reserved", or the publisher name for a paywalled article). Record what the source says; leave it empty rather than guessing."
        redistribution_permitted: "[String] Whether the source terms allow republishing the extracted values inside MOTEL under the repository data licence. Defaults to unknown until a person has checked. Deliberately not yes/no, because YAML reads bare yes and no as booleans. Never inferred automatically - a wrong "permitted" is a licensing exposure. Put conditions and caveats in source_notes."
        source_notes: "[String] Additional free-text source context, caveats, extraction notes, or provenance remarks not captured by the other source fields."
    attributes: # [List of Dictionaries] Array of carrier-level metrics populated directly from the unstructured raw intake profile, such as price, emission intensity, or annual availability. A metric reported for several periods contributes one entry per period.
        attribute_name: "[Required; String] Target metric descriptive identifier."
        value: "[Required; Any] The raw data value, number, string, or range, exactly as found in the source. May include the unit (e.g. 5 kW, 0.21 EUR/kWh). One value per attribute entry; a multi-period series becomes one entry per period, each with its own time_index."
        uncertainty_notes: "[String] Free-text description of any stated uncertainty, range, or confidence bounds."
        time_index: "[String] Chronological anchor string for this value, e.g. a single year. For a series across multiple periods, use one attribute entry per period rather than combining years here."
        attribute_notes: "[String] Any additional raw context, caveats, or parsing flags noted during ingestion. The unit could be defined here (e.g. Unit kW, Unit EUR/kWh)."
    metadata: # [Dictionary] Metadata grouping flags used to sort and locate the entity within project directories.
        related_project: "[String] Name of the overarching study consortium, database cluster, or project framework."
        tags: "[List of Strings] Arbitrary categorical tag index strings for filtering."
        other_notes: "[String/List] Any additional free-text notes or flags for project-level context. A single note or a list of notes; ingestion pipelines commonly append one provenance line per stage."
    harmonisation_record: # [Dictionary] Operational tracking fields created and updated by the harmonisation pipeline after ingestion.
        mapping_status: "[String] Lifecycle state set to to_be_mapped during ingestion and changed to mapped after successful harmonisation."
        linked_carrier_data_id: "[String] Linked carrier data identifier assigned after successful harmonisation."
        date_mapped: "[String] ISO 8601 date on which harmonisation completed successfully."
